# Software factory: an issue labelled `ready-for-agent` becomes a draft PR.
#
#   /triage (human) -> label ready-for-agent -> fresh runner + branch
#   -> Claude runs /implement on the agent brief -> tests gate -> push + draft PR
#   -> human review/merge
#
# Needs secrets.ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`).
# Optional: vars.FACTORY_APP_ID + secrets.FACTORY_APP_PRIVATE_KEY (a GitHub App), so the PR
# also triggers tests.yml. Without it the default token is used and tests.yml won't fire
# on the PR, which is why the suite also runs here as a gate.

name: agent-implement

on:
  issues:
    types: [labeled]

concurrency:
  group: agent-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  implement:
    if: github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: App token (optional, so the PR triggers tests.yml)
        id: app
        if: vars.FACTORY_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt

      - name: Create work branch
        id: branch
        run: |
          name="agent/issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b "$name"
          git config user.name  "duetto-factory"
          git config user.email "duetto-factory@users.noreply.github.com"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Install the lightweight-rule skills (runner only, never committed)
        run: |
          npx --yes @telesio/lightweight-rule@latest --claude-local
          echo ".claude/" >> .git/info/exclude

      - name: Fetch agent brief
        id: brief
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          brief=$(gh issue view "$ISSUE" --json comments \
            --jq '[.comments[] | select(.body | test("(?i)agent brief"))] | last | .body // empty')
          if [ -z "$brief" ]; then
            brief=$(gh issue view "$ISSUE" --json body --jq .body)
          fi
          delim="BRIEF_$(openssl rand -hex 8)"
          { echo "text<<$delim"; echo "$brief"; echo "$delim"; } >> "$GITHUB_OUTPUT"

      - name: Run the agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are working AFK on issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".
            The agent brief below is the contract: its acceptance criteria define done, and its
            out-of-scope list is binding. Do not push and do not open PRs; the workflow does that.
            Tests run with: python -m unittest discover -s tests

            <agent-brief>
            ${{ steps.brief.outputs.text }}
            </agent-brief>

            /implement
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Skill,Task,Bash(python -m unittest:*),Bash(python -m py_compile:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git log:*)"

      - name: Gate - test suite
        run: python -m unittest discover -s tests

      - name: Push and open draft PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          ISSUE: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git log "origin/$BASE"..HEAD --oneline)" ]; then
            gh issue comment "$ISSUE" --body "The factory run produced no commits. Back to triage."
            gh issue edit "$ISSUE" --remove-label ready-for-agent --add-label needs-triage
            exit 0
          fi
          git push -u origin "$BRANCH"
          gh pr create --draft --base "$BASE" --head "$BRANCH" \
            --title "$(gh issue view "$ISSUE" --json title --jq .title)" \
            --body "Closes #$ISSUE

          Implemented AFK by the factory from the agent brief. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue edit "$ISSUE" --remove-label ready-for-agent --add-label ready-for-human

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "Factory run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue edit ${{ github.event.issue.number }} --remove-label ready-for-agent --add-label needs-triage
